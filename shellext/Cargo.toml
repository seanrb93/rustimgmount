[package]
name = "rustimgmount_shell"
version = "0.1.0"
edition = "2021"
description = "Windows 11 right-click menu entries for rustimgmount (IExplorerCommand)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_Storage_Vhd",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[dependencies]
windows-core = "0.61"

# Built on its own (see README): `cargo build --release --manifest-path shellext/Cargo.toml`.
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
