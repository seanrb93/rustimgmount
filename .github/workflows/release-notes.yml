name: Release notes

# Keeps the notes of the published releases in step with CHANGELOG.md: whenever that file
# changes on main (or when run by hand), every release that has a section there gets its
# notes rewritten from it. A release from before checksums were published gets its
# checksum file added, worked out from the downloads it already has.

on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", "tools/release-notes.ps1", ".github/workflows/release-notes.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the notes of each release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh release list --limit 100 --json tagName --jq ".[].tagName"
          foreach ($tag in $tags) {
            try {
              ./tools/release-notes.ps1 -Version $tag -Out notes.md
            } catch {
              Write-Host "Skipping ${tag}: $($_.Exception.Message)"
              continue
            }
            gh release edit $tag --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "Could not update the notes of $tag" }
            Write-Host "Updated $tag"
            $assets = gh release view $tag --json assets --jq ".assets[].name"
            if (-not ($assets | Where-Object { $_ -like "*-sha256.txt" })) {
              $dir = "assets-$tag"
              gh release download $tag --dir $dir
              if ($LASTEXITCODE -ne 0) { throw "Could not download the files of $tag" }
              $lines = Get-ChildItem $dir -File | Sort-Object Name |
                ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
              $sums = Join-Path $dir "rustimgmount-$($tag.TrimStart('v'))-sha256.txt"
              [IO.File]::WriteAllText((Join-Path $PWD $sums), ($lines -join "`n") + "`n")
              gh release upload $tag $sums
              if ($LASTEXITCODE -ne 0) { throw "Could not add the checksums to $tag" }
              Write-Host "Added checksums to $tag"
            }
          }
