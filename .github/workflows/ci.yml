name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A normal run takes under 10 minutes; a hang (a test waiting forever) is stopped.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            shellext -> ../target/shellext
      - name: Install Inno Setup if the runner lacks it
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # The installer is built here too, so a mistake in its script shows up on the push
      # that made it, not when a release is tagged.
      - name: Build, test and package
        run: ./build.ps1 -Test -Package -Installer
      # Installs with each combination of the installer's tick boxes, checks the result
      # and uninstalls again.
      - name: Test the installer
        run: ./tools/test-installer.ps1 -Installer (Get-ChildItem dist\*-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: rustimgmount-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-sha256.txt
          if-no-files-found: error
